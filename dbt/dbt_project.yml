name: skullport
version: "1.0.0"
config-version: 2

profile: skullport

model-paths: ["models"]

models:
  skullport:
    # Materialize as Delta tables (full refresh; incremental is a future improvement)
    +materialized: table
    # The generate_schema_name macro makes these schemas literal (not target-prefixed),
    # so each layer simply states its own schema.
    silver:
      +schema: silver
    gold:
      +schema: gold
