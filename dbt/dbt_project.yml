name: skullport
version: "1.0.0"
config-version: 2

profile: skullport

model-paths: ["models"]

models:
  skullport:
    # Materialize everything as Delta tables (full refresh, idempotent). Future improvement incremental
    +materialized: table
    silver:
      # No +schema → uses the dbt task's target schema (silver_dbt)
      +tags: ["silver"]
    gold:
      +schema: gold_dbt
      +tags: ["gold"]
