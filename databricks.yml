# Databricks Asset Bundle — Skullport parcel pipeline
#
# SPIKE SCOPE: deploys a single Job that runs the dbt Silver models against a
# SQL warehouse, to validate the dbt deployment path. It reads the existing
# skullport.raw.* tables and writes to skullport.silver_dbt.* (a separate
# schema, so it does NOT clobber the notebook-built skullport.silver.* tables).
#
# One-time setup (nothing workspace-specific is committed):
#   cp .env.example .env      # then edit .env with your profile + warehouse id
#   source .env
# - host        comes from your `databricks auth login` profile (DATABRICKS_CONFIG_PROFILE)
# - warehouse_id comes from the BUNDLE_VAR_warehouse_id env var
#
# Deploy + run (single default target, no flags needed):
#   databricks bundle validate
#   databricks bundle deploy
#   databricks bundle run skullport_dbt_silver

bundle:
  name: skullport

variables:
  warehouse_id:
    description: SQL warehouse ID dbt runs against. Set via BUNDLE_VAR_warehouse_id (see .env.example).

resources:
  jobs:
    skullport_dbt_silver:
      name: skullport_dbt_silver
      tasks:
        - task_key: dbt_silver
          environment_key: dbt_env
          dbt_task:
            project_directory: dbt
            catalog: skullport
            schema: silver_dbt
            warehouse_id: ${var.warehouse_id}
            commands:
              - "dbt build --select silver"
      # Serverless compute that runs the dbt CLI itself (the SQL runs on the
      # warehouse above). dbt-databricks is installed into this environment.
      environments:
        - environment_key: dbt_env
          spec:
            client: "1"
            dependencies:
              - "dbt-databricks>=1.8,<2.0"

# A single, default target → `databricks bundle ...` needs no -t flag.
# `mode: development` deploys to your personal /Users/<you>/ workspace folder,
# so each person (you, a reviewer) gets an isolated deployment.
# No `workspace.host` here on purpose — it resolves from your CLI auth profile,
# so no workspace URL is committed to the repo.
targets:
  dev:
    mode: development
    default: true
